services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voiceiq
      POSTGRES_USER: voiceiq
      POSTGRES_PASSWORD: voiceiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceiq -d voiceiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

